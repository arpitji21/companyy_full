name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install libmagic
        # python-magic (used by the document-upload content sniffing) needs
        # the libmagic shared library at the OS level, not just the pip
        # package — matches the Dockerfile, which installs libmagic1 too.
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # tests/conftest.py points the app at an in-memory SQLite DB, so
        # this needs no Postgres/Redis service and no real SECRET_KEY.
        run: pytest -v

  frontend-checks:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        # VITE_ORBIT_API_URL isn't needed to verify the build compiles;
        # real deploys set it in Vercel's project settings.
        run: npm run build
